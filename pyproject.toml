[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "a3f-shield-research"
version = "0.1.0"
description = "Experimental authenticated file-encryption and replay-witness research"
authors = [{name = "pretorians115588/Andrw"}]
requires-python = ">=3.11"
dependencies = [
  "cryptography>=50,<51",
  "argon2-cffi>=23.1,<27",
]

[tool.pytest.ini_options]
testpaths = ["tests", "experimental/witness-v6"]
addopts = "-ra"

