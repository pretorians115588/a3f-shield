name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest pip-audit
      - name: Build native Threefish library
        shell: bash
        run: bash scripts/build_native.sh
      - run: python -m pytest -q
      - run: python -m pip check
      - run: python -m pip_audit

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
      - uses: ilammy/msvc-dev-cmd@v1
      - shell: cmd
        run: scripts\install_windows.cmd
      - run: python -m pytest -q

